[project]
name = "tracelens"
version = "0.1.0"
description = "Trace 骨架生成与按需展开组件：把大体积 Agent Trace 拆成「可读骨架 + 字节偏移索引」，骨架给 LLM 看，细节按 span_id 无损取回"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Mulan PSL v2" }
authors = [{ name = "openEuler agentic-engineering-team" }]
keywords = ["trace", "observability", "mlflow", "opentelemetry", "llm", "agent"]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Debuggers",
]
# 运行时第三方依赖只有 pydantic：承担规则/配置 schema 校验（见方案附录 B16）
dependencies = ["pydantic>=2.0"]

[project.optional-dependencies]
# 精确 token 计数；不装时用 chars/chars_per_token 估算
tokens = ["tiktoken>=0.7"]
# JSON 解析加速备用通道
speed = ["orjson>=3.9"]
# 按 grapheme cluster 截断（--strict-grapheme）
grapheme = ["regex>=2024.0.0"]

[project.scripts]
tracelens = "tracelens.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "syrupy>=4.6",
    "ruff>=0.6",
    "mypy>=1.11",
    "regex>=2026.7.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tracelens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: 大数据量/基准用例，可用 -m 'not slow' 跳过",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
packages = ["tracelens"]
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
branch = true
source = ["src/tracelens"]
